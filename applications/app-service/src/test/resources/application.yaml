server:
  port: 0
spring:
  application:
    name: ticketing-platform-test
  reactor:
    context-propagation: auto
  codec:
    max-in-memory-size: 16KB
logging:
  structured:
    format:
      console: ecs
  level:
    co.com.nequi.ticketing.dynamodb: DEBUG
app:
  role: api
  cors:
    allowed-origins: http://localhost:4200
security:
  jwt:
    mode: JWKS
    jwk-set-uri: http://localhost/started-by-test-identity-provider
    issuer: https://issuer.test
    audience: ticketing-platform
    roles-claim: cognito:groups
    admin-role: ticketing-admin
    clock-skew: 60s
webhook:
  secret: test-only-webhook-secret-0123456789
  tolerance: 5m
  event-ttl: 7d
rate-limit:
  orders:
    limit-for-period: 1000
    period: 1m
routes:
  base-path: /api/v1
  events: /events
  event-by-id: /events/{eventId}
  event-availability: /events/{eventId}/availability
  batch-availability: /events/availability
  availability-stream: /events/{eventId}/availability/stream
  orders: /orders
  order-by-id: /orders/{orderId}
  complimentary: /events/{eventId}/complimentary
  payment-webhook: /webhooks/payments
adapters:
  dynamodb:
    api-call-timeout: 5s
    api-call-attempt-timeout: 2s
    batch-concurrency: 4
    health-check-timeout: 2s
    orders-table: orders
    order-audit-table: order_audit
    idempotency-table: idempotency
    webhook-events-table: payment_webhook_events
    customer-limits-table: customer_event_limits
    expiring-reservations-index: expiring-reservations
    pending-publication-index: pending-publication
    transaction-conflict-retries: 10
    reserve-timeout: 5s
    scheduler-locks-table: scheduler_locks
  sqs:
    sender:
      region: us-east-1
      order-placed-queue: order-placed
      payment-confirmed-queue: payment-confirmed
      send-timeout: 2s
    listener:
      region: us-east-1
      order-placed-queue: order-placed
      order-placed-dlq: order-placed-dlq
      payment-confirmed-queue: payment-confirmed
      payment-confirmed-dlq: payment-confirmed-dlq
      wait-time: 1s
      max-messages: 10
      max-concurrency: 4
  payment:
    mode: APPROVE
    latency: 0s
    timeout: 2s
    approval-rate: 0.5
    slow-latency: 5s
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 20
      minimum-calls: 10
      wait-in-open: 30s
      half-open-calls: 3
inventory:
  shard-count: 3
availability:
  poll-interval: 1s
  batch-max-ids: 100
  stream:
    heartbeat: 15s
    max-duration: 30m
    retry: 1s
orders:
  max-tickets-per-order: 6
  max-tickets-per-customer: 6
  reservation-ttl: 10m
  republish-interval: 10s
  republish-grace: 5s
  republish-concurrency: 4
sweep:
  interval: 30s
  lock-lease: 60s
  batch-size: 500
  concurrency: 8
complimentary:
  max-per-grant: 50
idempotency:
  ttl: 24h
  lease: 10s
pagination:
  events:
    default-size: 20
    max-size: 100
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
