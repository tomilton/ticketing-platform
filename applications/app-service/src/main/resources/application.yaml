server:
  port: ${APP_PORT}
spring:
  application:
    name: ${APP_NAME}
  reactor:
    context-propagation: ${REACTOR_CONTEXT_PROPAGATION}
logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT}
app:
  role: ${APP_ROLE}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
security:
  jwt:
    mode: ${JWT_MODE}
    jwk-set-uri: ${JWT_JWK_SET_URI}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    roles-claim: ${JWT_ROLES_CLAIM}
    admin-role: ${JWT_ADMIN_ROLE}
    clock-skew: ${JWT_CLOCK_SKEW}
rate-limit:
  orders:
    limit-for-period: ${RATE_LIMIT_ORDERS_PER_PERIOD}
    period: ${RATE_LIMIT_ORDERS_PERIOD}
routes:
  base-path: ${ROUTES_BASE_PATH}
  events: ${ROUTES_EVENTS}
  event-by-id: ${ROUTES_EVENT_BY_ID}
  event-availability: ${ROUTES_EVENT_AVAILABILITY}
  batch-availability: ${ROUTES_BATCH_AVAILABILITY}
  availability-stream: ${ROUTES_AVAILABILITY_STREAM}
  orders: ${ROUTES_ORDERS}
  order-by-id: ${ROUTES_ORDER_BY_ID}
  complimentary: ${ROUTES_COMPLIMENTARY}
adapters:
  dynamodb:
    region: ${AWS_REGION}
    events-table: ${DYNAMODB_EVENTS_TABLE}
    inventory-table: ${DYNAMODB_INVENTORY_TABLE}
    events-by-status-date-index: ${DYNAMODB_EVENTS_BY_STATUS_DATE_INDEX}
    api-call-timeout: ${DYNAMODB_API_CALL_TIMEOUT}
    api-call-attempt-timeout: ${DYNAMODB_API_CALL_ATTEMPT_TIMEOUT}
    batch-concurrency: ${DYNAMODB_BATCH_CONCURRENCY}
    health-check-timeout: ${DYNAMODB_HEALTH_CHECK_TIMEOUT}
    orders-table: ${DYNAMODB_ORDERS_TABLE}
    order-audit-table: ${DYNAMODB_ORDER_AUDIT_TABLE}
    idempotency-table: ${DYNAMODB_IDEMPOTENCY_TABLE}
    customer-limits-table: ${DYNAMODB_CUSTOMER_LIMITS_TABLE}
    expiring-reservations-index: ${DYNAMODB_EXPIRING_RESERVATIONS_INDEX}
    pending-publication-index: ${DYNAMODB_PENDING_PUBLICATION_INDEX}
    transaction-conflict-retries: ${DYNAMODB_TRANSACTION_CONFLICT_RETRIES}
    reserve-timeout: ${DYNAMODB_RESERVE_TIMEOUT}
    scheduler-locks-table: ${DYNAMODB_SCHEDULER_LOCKS_TABLE}
  sqs:
    sender:
      region: ${AWS_REGION}
      order-placed-queue: ${SQS_ORDER_PLACED_QUEUE}
      send-timeout: ${SQS_SEND_TIMEOUT}
    listener:
      region: ${AWS_REGION}
      order-placed-queue: ${SQS_ORDER_PLACED_QUEUE}
      order-placed-dlq: ${SQS_ORDER_PLACED_DLQ}
      wait-time: ${SQS_WAIT_TIME}
      max-messages: ${SQS_MAX_MESSAGES}
      max-concurrency: ${SQS_MAX_CONCURRENCY}
  payment:
    mode: ${PAYMENT_SIMULATOR_MODE}
    latency: ${PAYMENT_SIMULATOR_LATENCY}
    timeout: ${PAYMENT_TIMEOUT}
    approval-rate: ${PAYMENT_SIMULATOR_APPROVAL_RATE}
    slow-latency: ${PAYMENT_SIMULATOR_SLOW_LATENCY}
inventory:
  shard-count: ${INVENTORY_SHARD_COUNT}
availability:
  poll-interval: ${AVAILABILITY_POLL_INTERVAL}
  batch-max-ids: ${AVAILABILITY_BATCH_MAX_IDS}
  stream:
    heartbeat: ${AVAILABILITY_STREAM_HEARTBEAT}
    max-duration: ${AVAILABILITY_STREAM_MAX_DURATION}
    retry: ${AVAILABILITY_STREAM_RETRY}
orders:
  max-tickets-per-order: ${ORDERS_MAX_TICKETS_PER_ORDER}
  max-tickets-per-customer: ${ORDERS_MAX_TICKETS_PER_CUSTOMER}
  reservation-ttl: ${ORDERS_RESERVATION_TTL}
  republish-interval: ${ORDERS_REPUBLISH_INTERVAL}
  republish-grace: ${ORDERS_REPUBLISH_GRACE}
  republish-concurrency: ${ORDERS_REPUBLISH_CONCURRENCY}
sweep:
  interval: ${SWEEP_INTERVAL}
  lock-lease: ${SWEEP_LOCK_LEASE}
  batch-size: ${SWEEP_BATCH_SIZE}
  concurrency: ${SWEEP_CONCURRENCY}
complimentary:
  max-per-grant: ${COMPLIMENTARY_MAX_PER_GRANT}
idempotency:
  ttl: ${IDEMPOTENCY_TTL}
  lease: ${IDEMPOTENCY_LEASE}
pagination:
  events:
    default-size: ${EVENTS_PAGE_DEFAULT_SIZE}
    max-size: ${EVENTS_PAGE_MAX_SIZE}
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSURE}
  endpoint:
    health:
      probes:
        enabled: ${MANAGEMENT_HEALTH_PROBES_ENABLED}
      show-components: ${MANAGEMENT_HEALTH_SHOW_COMPONENTS}
