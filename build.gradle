plugins {
	id 'co.com.bancolombia.cleanArchitecture'
	id 'org.springframework.boot' version '4.1.2' apply false
    id 'org.sonarqube'
    id 'info.solidsoft.pitest'
}

ext {
    awsSdkVersion = providers.gradleProperty('awsSdkVersion').get()
    mapstructVersion = providers.gradleProperty('mapstructVersion').get()
    springdocVersion = providers.gradleProperty('springdocVersion').get()
    testcontainersVersion = providers.gradleProperty('testcontainersVersion').get()
    blockhoundVersion = providers.gradleProperty('blockhoundVersion').get()
    lombokMapstructBindingVersion = providers.gradleProperty('lombokMapstructBindingVersion').get()
}

allprojects {
    repositories {
        mavenCentral()
    }
    dependencies {
		implementation platform("software.amazon.awssdk:bom:${rootProject.ext.awsSdkVersion}")
    }
}

// Force dependency versions to address reported vulnerabilities.
dependenciesOverride {
   ensure 'com.fasterxml.jackson.core:jackson-core:2.22.4'
   ensure 'tools.jackson.core:jackson-core:3.2.4'
}

subprojects {
    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
                vendor = JvmVendorSpec.ADOPTIUM
            }
        }
    }

    // Remove once it has been updated in Spring Boot
    ext['jackson-2-bom.version'] = "2.22.4"
    ext['jackson-bom.version'] = "3.2.4"
}

def applicationYamlFiles = files('applications/app-service/src/main/resources/application.yaml',
        'applications/app-service/src/main/resources/application-local.yaml')
def environmentExampleFile = file('deployment/.env.example')
def terraformFiles = fileTree('deployment/terraform') { include '**/*.tf' }

// C051: every ${VAR} of the application configuration exists in deployment/.env.example and the other
// way round. Variables read directly by the AWS SDK, Spring or the containers are allowed.
tasks.register('verifyEnvironmentParity') {
    group = 'verification'
    description = 'Checks that application*.yaml and deployment/.env.example declare the same variables'
    inputs.files(applicationYamlFiles, environmentExampleFile)
    def allowedOnlyInEnvironment = ['AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'SPRING_PROFILES_ACTIVE'] as Set
    doLast {
        def placeholder = ~/\$\{([A-Z0-9_]+)}/
        def yamlVariables = applicationYamlFiles.files.collectMany { yaml -> (yaml.text =~ placeholder).collect { it[1] } } as Set
        def environmentVariables = environmentExampleFile.readLines()
                .findAll { line -> line.contains('=') && !line.startsWith('#') }
                .collect { line -> line.substring(0, line.indexOf('=')).trim() } as Set
        def missingInEnvironment = yamlVariables - environmentVariables
        def missingInYaml = environmentVariables - yamlVariables - allowedOnlyInEnvironment
        if (!terraformFiles.isEmpty()) {
            def terraformText = terraformFiles.files*.text.join('\n')
            missingInEnvironment += yamlVariables.findAll { !terraformText.contains(it) }
        }
        if (missingInEnvironment || missingInYaml) {
            throw new GradleException("Environment parity failed. Missing in .env.example or Terraform: "
                    + missingInEnvironment.sort() + "; missing in application*.yaml: " + missingInYaml.sort())
        }
    }
}
