plugins {
	id 'co.com.bancolombia.cleanArchitecture'
	id 'org.springframework.boot' version '4.1.2' apply false
    id 'org.sonarqube'
    id 'info.solidsoft.pitest'
}

ext {
    awsSdkVersion = providers.gradleProperty('awsSdkVersion').get()
    mapstructVersion = providers.gradleProperty('mapstructVersion').get()
    springdocVersion = providers.gradleProperty('springdocVersion').get()
    testcontainersVersion = providers.gradleProperty('testcontainersVersion').get()
    blockhoundVersion = providers.gradleProperty('blockhoundVersion').get()
    objectMapperVersion = providers.gradleProperty('objectMapperVersion').get()
}

allprojects {
    repositories {
        mavenCentral()
    }
    dependencies {
		implementation platform("software.amazon.awssdk:bom:${rootProject.ext.awsSdkVersion}")
    }
}

// Force dependency versions to address reported vulnerabilities.
dependenciesOverride {
   ensure 'com.fasterxml.jackson.core:jackson-core:2.22.4'
   ensure 'tools.jackson.core:jackson-core:3.2.4'
}

subprojects {
    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
                vendor = JvmVendorSpec.ADOPTIUM
            }
        }
    }

    // Remove once it has been updated in Spring Boot
    ext['jackson-2-bom.version'] = "2.22.4"
    ext['jackson-bom.version'] = "3.2.4"
}
