spring:
  profiles:
    active: local
app:
  role: api
  cors:
    allowed-origins: http://localhost:4200
routes:
  base-path: /api/v1
  events: /events
  event-by-id: /events/{eventId}
  event-availability: /events/{eventId}/availability
  batch-availability: /events/availability
  availability-stream: /events/{eventId}/availability/stream
  orders: /orders
  order-by-id: /orders/{orderId}
  complimentary: /events/{eventId}/complimentary
pagination:
  events:
    default-size: 20
    max-size: 100
availability:
  batch-max-ids: 100
  stream:
    heartbeat: 100ms
    max-duration: 500ms
    retry: 1s
security:
  jwt:
    mode: LOCAL_HS256
    jwk-set-uri: http://localhost/unused-in-local-mode
    issuer: https://issuer.test
    audience: ticketing-platform
    roles-claim: cognito:groups
    admin-role: ticketing-admin
    clock-skew: 60s
    local-secret: test-only-secret-for-hs256-tokens-0123456789
