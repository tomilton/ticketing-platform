apply plugin: 'java-test-fixtures'

dependencies {
    implementation project(':commons')
    implementation 'software.amazon.awssdk:dynamodb-enhanced'
    implementation 'software.amazon.awssdk:netty-nio-client'
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"
    compileOnly 'org.springframework.boot:spring-boot-starter'
    compileOnly 'org.springframework.boot:spring-boot-health'
    compileOnly 'jakarta.validation:jakarta.validation-api'
    compileOnly 'tools.jackson.core:jackson-databind'
    testImplementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-health'
    testImplementation 'tools.jackson.core:jackson-databind'
    testFixturesImplementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    testFixturesImplementation platform("org.testcontainers:testcontainers-bom:${testcontainersVersion}")
    testFixturesImplementation 'org.testcontainers:testcontainers-localstack'
    testFixturesImplementation 'software.amazon.awssdk:dynamodb'
    testFixturesImplementation 'software.amazon.awssdk:sqs'
    testFixturesImplementation 'software.amazon.awssdk:netty-nio-client'
    testImplementation "io.projectreactor.tools:blockhound:${blockhoundVersion}"
    testImplementation "io.projectreactor.tools:blockhound-junit-platform:${blockhoundVersion}"
}

tasks.named('test') {
    jvmArgs '-XX:+AllowRedefinitionToAddDeleteMethods', '-XX:+EnableDynamicAgentLoading'
    systemProperty 'project.root', rootProject.projectDir.absolutePath
}

pitest {
    excludedTestClasses = ['*IntegrationTest']
}
